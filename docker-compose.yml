# ══════════════════════════════════════════════════════════════════
#  docker-compose.yml — Local development
#  Usage: docker compose up --build
# ══════════════════════════════════════════════════════════════════

services:

  # ── FastAPI backend ────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: badminton_api
    ports:
      - "8000:8000"
    volumes:
      # Mount the source for hot-reloading in dev (remove in prod)
      - .:/app
    environment:
      - CHECKPOINT_NAME=best_bigru.pth
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── React frontend (dev server) ─────────────────────────────────
  frontend-dev:
    image: node:20-alpine
    container_name: badminton_ui_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - dev          # only start with: docker compose --profile dev up

  # ── React frontend (production nginx) ───────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: badminton_ui
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - prod         # only start with: docker compose --profile prod up

networks:
  default:
    name: badminton_net
